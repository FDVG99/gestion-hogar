<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icono.png">
  <title>Gestión Hogar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; color: #f8fafc; }

    #launcherScreen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 28px;
      text-align: center; background: #0f172a; z-index: 30;
    }
    .icon-box {
      width: 80px; height: 80px; border-radius: 22px; background: #1e293b;
      border: 1px solid #334155; display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .icon-box img { width: 54px; height: 54px; object-fit: contain; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; max-width: 290px; line-height: 1.5; margin-bottom: 28px; }
    .btn-primary {
      width: 100%; max-width: 280px; background: #10b981; color: #ffffff; border: none;
      padding: 15px 24px; border-radius: 14px; font-size: 15px; font-weight: 700;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
      justify-content: center; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      width: 100%; max-width: 280px; margin-top: 12px; background: #1e293b; color: #cbd5e1;
      border: 1px solid #334155; padding: 12px 20px; border-radius: 14px; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }
    .hint { margin-top: 20px; font-size: 11px; color: #64748b; max-width: 270px; }

    iframe {
      position: fixed; inset: 0; border: none; width: 100%; height: 100%;
      display: block; z-index: 20; background: #0f172a;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="launcherScreen">
    <div class="icon-box">
      <img src="icono.png" alt="Gestión Hogar" onerror="this.style.display='none'">
    </div>
    <h1>Finanzas del Hogar</h1>
    <p>Control compartido de cuotas mensuales, recibos y pozo familiar.</p>

    <a href="https://script.google.com/macros/s/AKfycbzbqRvCNyvlbhj7xxL9Ckwca2hbLI9Agn3ToIqM4vzSB7pDEuRWi9BQESlI5Oy9wMV5WQ/exec" class="btn-primary">
      Ingresar con mi cuenta Google
    </a>

    <button onclick="abrirEnMarco()" class="btn-secondary">
      Cargar en vista integrada (sin barra)
    </button>

    <span class="hint">Si usas iPhone o tienes varias cuentas Gmail en el teléfono, usa el botón verde.</span>
  </div>

  <iframe id="appFrame" class="hidden" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbqRvCNyvlbhj7xxL9Ckwca2hbLI9Agn3ToIqM4vzSB7pDEuRWi9BQESlI5Oy9wMV5WQ/exec";

    function abrirEnMarco() {
      document.getElementById('launcherScreen').classList.add('hidden');
      const frame = document.getElementById('appFrame');
      frame.classList.remove('hidden');
      frame.src = APPS_SCRIPT_URL;
    }
  </script>
</body>
</html>
