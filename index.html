<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icono.png">
  <title>Gestión Hogar</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; background-color: #0f172a; color: #f8fafc; }

    #loginScreen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 28px;
      text-align: center; background: #0f172a; z-index: 30;
    }
    .icon-box {
      width: 80px; height: 80px; border-radius: 22px; background: #1e293b;
      border: 1px solid #334155; display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .icon-box img { width: 54px; height: 54px; object-fit: contain; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; max-width: 290px; line-height: 1.5; margin-bottom: 28px; }
    .signin-wrap { display: flex; justify-content: center; min-height: 44px; }
    #statusText { margin-top: 18px; font-size: 12px; color: #10b981; font-weight: 600; min-height: 18px; }
    .btn-reset {
      margin-top: 24px; background: transparent; border: none; color: #64748b;
      font-size: 11px; text-decoration: underline; cursor: pointer; display: none;
    }
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="icon-box">
      <img src="icono.png" alt="Gestión Hogar" onerror="this.style.display='none'">
    </div>
    <h1>Finanzas del Hogar</h1>
    <p>Inicia sesión con tu cuenta Gmail familiar para acceder al pozo y recibos del mes.</p>

    <div class="signin-wrap">
      <div id="g_id_onload"
           data-client_id="252920345538-gq6c1c99ntsk88d9sj19jvjkre2mt1nd.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="onGoogleSignIn"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-shape="pill"
           data-theme="filled_black"
           data-text="signin_with"
           data-size="large"
           data-logo_alignment="left">
      </div>
    </div>

    <div id="statusText"></div>
    <button id="btnClearSession" class="btn-reset" onclick="cerrarSesionLocal()">Cambiar de cuenta Google</button>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "252920345538-gq6c1c99ntsk88d9sj19jvjkre2mt1nd.apps.googleusercontent.com";
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbqRvCNyvlbhj7xxL9Ckwca2hbLI9Agn3ToIqM4vzSB7pDEuRWi9BQESlI5Oy9wMV5WQ/exec";
    const STORAGE_KEY = "gestion_hogar_id_token";

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(decodeURIComponent(atob(base64).split('').map(c =>
          '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
        ).join('')));
      } catch (e) {
        return null;
      }
    }

    function abrirAppConToken(token, email) {
      document.getElementById('statusText').textContent = `Entrando como ${email}...`;
      const destino = `${APPS_SCRIPT_URL}?token=${encodeURIComponent(token)}`;
      window.location.replace(destino);
    }

    function onGoogleSignIn(response) {
      const token = response.credential;
      const payload = parseJwt(token);
      if (!payload || !payload.email) {
        document.getElementById('statusText').textContent = "Error al leer cuenta. Intenta de nuevo.";
        return;
      }
      localStorage.setItem(STORAGE_KEY, token);
      abrirAppConToken(token, payload.email);
    }

    function cerrarSesionLocal() {
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('statusText').textContent = "Sesión limpiada. Elige tu cuenta arriba.";
      document.getElementById('btnClearSession').style.display = "none";
    }

    // Si ya inició sesión antes y el token de Google aún no expira (dura 1 hora), entra directo
    window.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem(STORAGE_KEY);
      if (savedToken) {
        const payload = parseJwt(savedToken);
        const now = Math.floor(Date.now() / 1000);
        if (payload && payload.exp && payload.exp > (now + 60)) {
          document.getElementById('btnClearSession').style.display = "inline-block";
          abrirAppConToken(savedToken, payload.email);
        } else {
          localStorage.removeItem(STORAGE_KEY);
        }
      }
    });
  </script>
</body>
</html>
